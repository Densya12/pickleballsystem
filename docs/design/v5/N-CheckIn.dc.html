<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player · Check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111412}a:hover{color:#3a3f3c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: Inter, system-ui, sans-serif; color: #111412; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0">
    <p style="margin: 0; font-size: 13px; color: #6B716D; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5E9F1C"></span>Pasig Pickleball · 8 in queue</p>
    <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.4px">Biyernes Night</h1>
  </div>

  <div style="margin: 22px 16px 0; background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <label for="ci-name" style="display: block; font-size: 13px; font-weight: 500; color: #4D5350; margin-bottom: 6px">Name</label>
      <input id="ci-name" value="Ana Lopez" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #DADAD4; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #111412; background: #FFFFFF">
    </div>
    <div>
      <p style="margin: 0 0 6px; font-size: 13px; font-weight: 500; color: #4D5350">Level <span style="font-weight: 400; color: #6B716D">(optional)</span></p>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="height: 34px; border: 1px solid #DADAD4; border-radius: 999px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 13px; color: #111412">Beginner</button>
        <button aria-pressed="true" style="height: 34px; border: 1px solid #111412; border-radius: 999px; background: #111412; color: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 13px">Intermediate</button>
        <button style="height: 34px; border: 1px solid #DADAD4; border-radius: 999px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 13px; color: #111412">Advanced</button>
      </div>
    </div>
  </div>

  <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 20px; padding: 16px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <p style="margin: 0; font-size: 15px; font-weight: 600">Payment</p>
      <p style="margin: 0; font-size: 15px; font-weight: 600">₱150</p>
    </div>
    <div role="radiogroup" aria-label="Payment method" style="display: flex; background: #F1F1ED; border-radius: 12px; padding: 3px; margin-top: 12px">
      <button role="radio" aria-checked="true" style="flex: 1; height: 36px; border: 0; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #111412; box-shadow: 0 1px 2px rgba(17,20,18,0.08)">GCash</button>
      <button role="radio" aria-checked="false" style="flex: 1; height: 36px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #6B716D">Cash</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 10px 12px; background: #F7F7F4; border-radius: 12px">
      <div><p style="margin: 0; font-size: 13px; color: #6B716D">Send to · M. Santos</p><p style="margin: 2px 0 0; font-size: 15px; font-weight: 500; letter-spacing: 0.3px">0917 123 4567</p></div>
      <button style="height: 32px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #111412">Copy</button>
    </div>
    <label for="ci-ref" style="display: block; font-size: 13px; font-weight: 500; color: #4D5350; margin: 14px 0 6px">GCash reference no.</label>
    <input id="ci-ref" placeholder="e.g. 1009 876 543210" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #DADAD4; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #111412; background: #FFFFFF">
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 16px; background: #111412; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">Join queue</button>
    <p style="margin: 10px 0 0; text-align: center; font-size: 12px; color: #6B716D">We only collect your name and level, so the organizer can run the queue.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
